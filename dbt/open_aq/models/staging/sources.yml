version: 2

sources:
  - name: openaq
    database: openaq
    schema: public
    tables:
      - name: parameters
        config: 
          freshness: null
      - name: raw_air_quality
        config:
          freshness: 
            warn_after: 
              count: 12
              period: hour
            error_after: 
              count: 24
              period: hour
          loaded_at_field: loaded_timestamp